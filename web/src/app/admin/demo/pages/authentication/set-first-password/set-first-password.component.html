<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <a [routerLink]="['/']"><img src="assets/images/logo.png" alt="logo" /></a>
      </div>
      <div class="card my-5">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0"><b>Set First Password</b></h3>
            <a [routerLink]="['/admin/login']" class="link-primary">Back to Login</a>
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="form-group mb-3">
              <label class="form-label" for="password">New Password</label>
              <div class="password-field">
                <input
                  [type]="showPassword() ? 'text' : 'password'"
                  class="form-control"
                  id="password"
                  formControlName="password"
                  placeholder="New Password"
                  autocomplete="new-password"
                  maxlength="128"
                  aria-describedby="password-rules"
                />
                <button
                  type="button"
                  class="password-toggle"
                  (click)="togglePasswordVisibility()"
                  [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                  [attr.aria-pressed]="showPassword()"
                >
                  <i class="ti" [class.ti-eye]="!showPassword()" [class.ti-eye-off]="showPassword()"></i>
                </button>
              </div>
            </div>

            <div class="form-group mb-3">
              <label class="form-label" for="confirmPassword">Confirm Password</label>
              <div class="password-field">
                <input
                  [type]="showConfirmPassword() ? 'text' : 'password'"
                  class="form-control"
                  id="confirmPassword"
                  formControlName="confirmPassword"
                  placeholder="Confirm Password"
                  autocomplete="new-password"
                  maxlength="128"
                  aria-describedby="password-rules"
                />
                <button
                  type="button"
                  class="password-toggle"
                  (click)="toggleConfirmPasswordVisibility()"
                  [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'"
                  [attr.aria-pressed]="showConfirmPassword()"
                >
                  <i
                    class="ti"
                    [class.ti-eye]="!showConfirmPassword()"
                    [class.ti-eye-off]="showConfirmPassword()"
                  ></i>
                </button>
              </div>
            </div>

            <ul id="password-rules" class="password-rules list-unstyled mb-3" aria-label="Password requirements">
              <li [class.rule-met]="rules.minLength">
                <span class="rule-dot" aria-hidden="true"></span>
                At least 8 characters
              </li>
              <li [class.rule-met]="rules.mixedCase">
                <span class="rule-dot" aria-hidden="true"></span>
                Uppercase and lowercase letters
              </li>
              <li [class.rule-met]="rules.numberOrSymbol">
                <span class="rule-dot" aria-hidden="true"></span>
                At least one number or special character
              </li>
              <li [class.rule-met]="rules.match">
                <span class="rule-dot" aria-hidden="true"></span>
                Passwords match
              </li>
            </ul>

            <div class="d-grid mt-4">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="loading() || !token() || form.invalid"
              >
                {{ loading() ? 'Saving…' : 'Set Password' }}
              </button>
            </div>
          </form>
        </div>
      </div>
      <div class="auth-footer row"></div>
    </div>
  </div>
</div>
