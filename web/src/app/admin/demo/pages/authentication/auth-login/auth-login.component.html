<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <a [routerLink]="['/admin/login']"><img src="assets/images/logo.png" alt="Orvia logo" /></a>
      </div>
      <div class="card my-5 shadow-sm">
        <div class="card-body p-4 p-sm-5">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
              <h3 class="mb-1"><b>Login</b></h3>
              <p class="text-muted text-sm mb-0">Sign in to your administrator portal</p>
            </div>
            <a [routerLink]="['/admin/register']" class="link-primary text-sm"
              >Don't have an account? Sign up</a
            >
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="email">Email Address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              #email
              placeholder="Email Address"
              (keyup.enter)="signIn(email.value, password.value)"
            />
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              #password
              placeholder="Password"
              (keyup.enter)="signIn(email.value, password.value)"
            />
          </div>
          <div class="d-flex mt-1 justify-content-between">
            <div class="form-check">
              <input
                class="form-check-input input-primary"
                type="checkbox"
                id="customCheckc1"
                checked=""
              />
              <label class="form-check-label text-muted text-sm" for="customCheckc1"
                >Keep me signed in</label
              >
            </div>
            <h5 class="text-secondary f-w-400">
              <a
                [routerLink]="['/admin/password/setup']"
                class="btn btn-link text-secondary p-0 text-decoration-none text-sm"
                style="
                  font-size: inherit;
                  font-weight: inherit;
                  line-height: inherit;
                  vertical-align: baseline;
                "
              >
                Invitation token?
              </a>
            </h5>
          </div>
          <div class="d-grid mt-4">
            <button
              type="button"
              class="btn btn-primary"
              [disabled]="loading()"
              (click)="signIn(email.value, password.value)"
            >
              {{ loading() ? 'Signing in…' : 'Login' }}
            </button>
          </div>
          @if (error()) {
            <div class="alert alert-danger mt-3 mb-0 py-2" role="alert">{{ error() }}</div>
          }
          <div class="saprator mt-4">
            <span>Login with</span>
          </div>
          <div class="row justify-content-center">
            @for (item of SignInOptions; track item.name) {
              <div class="col-6 col-sm-4">
                <div class="d-grid">
                  <button type="button" class="btn mt-2 btn-light-primary bg-light text-muted">
                    <img [src]="item.image" alt="google img" />
                    <span class="ms-1">{{ item.name }}</span>
                  </button>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
      <div class="auth-footer row">
        <div class="col my-1">
          <p class="m-0 text-sm text-muted">Orvia Education Platform &copy; 2026</p>
        </div>
      </div>
    </div>
  </div>
</div>
